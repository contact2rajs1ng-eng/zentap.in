<div id="auth-overlay" class="auth-overlay" hidden>
  <div class="auth-panel">
    <button class="auth-close" id="auth-close-btn" aria-label="Close">&times;</button>
    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="signin">Sign In</button>
      <button class="auth-tab" data-tab="signup">Create Account</button>
    </div>

    <form id="auth-form">
      <div class="form-field" data-signup-only style="display:none;">
        <label for="auth-name">Full name</label>
        <input type="text" id="auth-name" placeholder="Your name">
      </div>
      <div class="form-field">
        <label for="auth-email">Email</label>
        <input type="email" id="auth-email" placeholder="you@example.com" required>
      </div>
      <div class="form-field">
        <label for="auth-password">Password</label>
        <input type="password" id="auth-password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-copper btn-block" id="auth-submit-btn">Sign In</button>

      <div class="auth-divider"><span>or continue with</span></div>

      <div class="auth-social">
        <button type="button" class="btn btn-ghost-light btn-block auth-social-btn" data-provider="Phone Number">Phone Number</button>
      </div>
      <p class="form-note" id="auth-note">Accounts are powered by Zentap's own login system.</p>
    </form>

    <div id="account-view" hidden>
      <div class="account-avatar" id="account-avatar">Z</div>
      <div class="account-name" id="account-name">Your Account</div>
      <div class="account-email" id="account-email"></div>
      <button type="button" class="btn btn-ghost-light btn-block" id="sign-out-btn">Sign Out</button>
    </div>
  </div>
